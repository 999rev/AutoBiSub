[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subsync"
version = "0.1.0"
description = "Local video-to-bilingual-subtitle CLI & folder watcher powered by faster-whisper and async LLM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "faster-whisper>=1.1.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "watchdog>=4.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "respx>=0.21.0",
    "ruff>=0.4.0",
]

[project.scripts]
subsync = "subsync.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/subsync"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
